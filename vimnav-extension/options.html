<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VimNav options</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <main>
    <h1>VimNav</h1>
    <p class="hint">Vim motions are idle until you enter <b>normal mode</b>.</p>

    <label for="chord">Enter normal mode chord (press the key twice)</label>
    <input id="chord" type="text" maxlength="1" placeholder="j">

    <label for="chordInterval">Double-press window (ms)</label>
    <input id="chordInterval" type="number" min="100" max="1000" step="50" placeholder="300">

    <label for="lineStep">Scroll step (px for j/k/h/l)</label>
    <input id="lineStep" type="number" min="10" max="400" step="10" placeholder="88">

    <button id="save">Save</button>
    <p id="saved" class="saved">Saved.</p>
  </main>
  <script src="options.js"></script>
</body>
</html>
